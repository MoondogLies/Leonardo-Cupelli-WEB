<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leonardo Cupelli — Composer</title>
  <meta name="description" content="Official portfolio of composer Leonardo Cupelli. Listen to releases on Spotify, Bandcamp, Apple Music and YouTube.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400;500;600&family=Inter:wght@400;500;600&family=Rubik:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/grain.css">
  <style>
    html { scroll-snap-type: y mandatory; }
    .release { scroll-snap-align: start; scroll-snap-stop: always; border-top: 0; }
    .contact { scroll-snap-align: start; scroll-snap-stop: always; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; padding: 0; border-top: 0; }
    .contact-content { flex: 1; display: grid; place-content: center; padding: 100px 24px 48px; overflow-wrap: anywhere; }
    .contact .site-footer { flex: none; width: 100%; border-top: 0; scroll-snap-align: none; padding-bottom: max(34px, env(safe-area-inset-bottom, 0px)); }
    .contact-icons { display: flex; justify-content: center; gap: 24px; margin-top: 20px; }
    .contact-icon { appearance: none; display: grid; place-items: center; width: 48px; height: 48px; padding: 10px; border: 0; background: transparent; color: var(--text); border-radius: 0; }
    .contact-icon:disabled { opacity: 1; cursor: default; -webkit-text-fill-color: currentColor; }
    .contact-icon svg { display: block; width: 28px; height: 28px; }
    .header-top { margin-right: auto; display: grid; place-items: center; width: 28px; height: 28px; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s ease, visibility 0s linear .3s; }
    .header-top svg { width: 20px; height: 20px; }
    .header-top.is-visible { opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; }
    .header-top:hover { color: var(--spotify-green); }
    .header-top:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-snap-type: y proximity; scroll-behavior: auto; }
      .header-top { transition: none; }
    }
  </style>
</head>
<body>
  <header class="site-header is-dark" id="site-header">
    <a class="header-top" id="header-top" href="#top" aria-label="Torna in cima alla pagina" aria-hidden="true" tabindex="-1" inert>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 3h14"></path>
        <path d="M12 21V7m-6 6 6-6 6 6"></path>
      </svg>
    </a>
    <nav class="site-nav">
      <a href="releases.html">Discography</a>
      <a href="#contact">Contacts</a>
    </nav>
  </header>
  <main id="top" tabindex="-1">
    <section id="releases" class="releases" aria-label="Releases">
      <div id="release-list"></div>
    </section>
    <section id="contact" class="contact" aria-labelledby="contact-title">
      <div class="contact-content">
        <h2 id="contact-title">Contact</h2>
        <p>For bookings, collaborations and enquiries:</p>
        <div class="contact-icons" role="group" aria-label="Contatti e social — collegamenti non ancora attivi">
          <button class="contact-icon" type="button" aria-label="Mail — non ancora attivo" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
          </button>
          <button class="contact-icon" type="button" aria-label="Instagram — non ancora attivo" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C8.74 0 8.333.014 7.053.072 5.775.13 4.903.333 4.14.63a5.88 5.88 0 0 0-2.126 1.384A5.88 5.88 0 0 0 .63 4.14C.333 4.903.13 5.775.072 7.053.014 8.333 0 8.74 0 12s.014 3.667.072 4.947c.058 1.278.261 2.15.558 2.913a5.88 5.88 0 0 0 1.384 2.126A5.88 5.88 0 0 0 4.14 23.37c.763.297 1.635.5 2.913.558C8.333 23.986 8.74 24 12 24s3.667-.014 4.947-.072c1.278-.058 2.15-.261 2.913-.558a5.88 5.88 0 0 0 2.126-1.384 5.88 5.88 0 0 0 1.384-2.126c.297-.763.5-1.635.558-2.913C23.986 15.667 24 15.26 24 12s-.014-3.667-.072-4.947c-.058-1.278-.261-2.15-.558-2.913a5.88 5.88 0 0 0-1.384-2.126A5.88 5.88 0 0 0 19.86.63c-.763-.297-1.635-.5-2.913-.558C15.667.014 15.26 0 12 0zm0 2.162c3.204 0 3.584.012 4.849.07 1.17.053 1.805.249 2.228.413.56.218.96.478 1.38.898.42.42.68.82.898 1.38.164.423.36 1.058.413 2.228.058 1.265.07 1.645.07 4.849s-.012 3.584-.07 4.849c-.053 1.17-.249 1.805-.413 2.228a3.72 3.72 0 0 1-.898 1.38c-.42.42-.82.68-1.38.898-.423.164-1.058.36-2.228.413-1.265.058-1.645.07-4.849.07s-3.584-.012-4.849-.07c-1.17-.053-1.805-.249-2.228-.413a3.72 3.72 0 0 1-1.38-.898 3.72 3.72 0 0 1-.898-1.38c-.164-.423-.36-1.058-.413-2.228-.058-1.265-.07-1.645-.07-4.849s.012-3.584.07-4.849c.053-1.17.249-1.805.413-2.228.218-.56.478-.96.898-1.38.42-.42.82-.68 1.38-.898.423-.164 1.058-.36 2.228-.413 1.265-.058 1.645-.07 4.849-.07zm0 3.676a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm7.846-10.405a1.44 1.44 0 1 1-2.88 0 1.44 1.44 0 0 1 2.88 0z"/></svg>
          </button>
          <button class="contact-icon" type="button" aria-label="Facebook — non ancora attivo" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047v-2.66c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.971h-1.513c-1.49 0-1.956.931-1.956 1.887v2.263h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
          </button>
        </div>
      </div>
      <footer class="site-footer" role="contentinfo">
        <p>© <span id="year"></span> Leonardo Cupelli. All rights reserved.</p>
      </footer>
    </section>
  </main>
  <script src="js/catalogue.js"></script>
  <script src="js/spotify-logo.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cover-scroll.js"></script>
  <script src="js/dattilogramma-scroll.js" defer></script>
  <script>
    (() => {
      const link = document.getElementById('header-top');
      const header = document.getElementById('site-header');
      const list = document.getElementById('release-list');
      const contact = document.getElementById('contact');
      let pending = false;
      function update() {
        pending = false;
        const second = list.querySelector('.release')?.nextElementSibling;
        const headerBottom = header.getBoundingClientRect().bottom;
        const contactRect = contact.getBoundingClientRect();
        const atContact = contactRect.top <= headerBottom && contactRect.bottom > 0;
        const pastFirst = !!second && second.getBoundingClientRect().top <= headerBottom;
        const visible = atContact || pastFirst;
        link.classList.toggle('is-visible', visible);
        link.setAttribute('aria-hidden', String(!visible));
        link.tabIndex = visible ? 0 : -1;
        link.toggleAttribute('inert', !visible);
      }
      function schedule() {
        if (!pending) { pending = true; requestAnimationFrame(update); }
      }
      function afterNavigation() {
        schedule();
        requestAnimationFrame(() => requestAnimationFrame(schedule));
      }
      link.addEventListener('click', event => {
        event.preventDefault();
        document.getElementById('top').focus({ preventScroll: true });
        window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
        afterNavigation();
      });
      document.querySelector('.site-nav a[href="#contact"]').addEventListener('click', afterNavigation);
      window.addEventListener('scroll', schedule, { passive: true });
      document.addEventListener('scrollend', schedule);
      window.addEventListener('hashchange', afterNavigation);
      window.addEventListener('resize', schedule);
      window.addEventListener('pageshow', afterNavigation);
      window.visualViewport?.addEventListener('resize', schedule);
      window.visualViewport?.addEventListener('scroll', schedule);
      new IntersectionObserver(schedule, { threshold: [0, .25, .5, .75, 1] }).observe(contact);
      new MutationObserver(schedule).observe(list, { childList: true });
      const sizes = new ResizeObserver(schedule);
      sizes.observe(list);
      sizes.observe(contact);
      update();
    })();
  </script>
</body>
</html>
