<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discography — Leonardo Cupelli</title>
  <meta name="description" content="Le pubblicazioni di Leonardo Cupelli, dalla più recente alla più vecchia.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="css/archive.css?v=4">
  <link rel="stylesheet" href="css/grain.css?v=2">
  <style>
    .archive-page .archive-header { min-height: calc(max(20px, env(safe-area-inset-top, 0px)) + 64px); }
    .archive-page .back-home {
      position: fixed;
      top: max(20px, env(safe-area-inset-top, 0px));
      left: max(clamp(22px, 6vw, 80px), env(safe-area-inset-left, 0px));
      z-index: 20;
    }
    .archive-page .archive-title {
      position: fixed;
      top: calc(var(--archive-title-top, 108px) + 40px);
      bottom: auto;
      left: max(clamp(22px, 6vw, 80px), env(safe-area-inset-left, 0px));
      width: max-content;
      transform: rotate(-90deg) translateX(-100%);
      transform-origin: top left;
    }
  </style>
  <script src="js/catalogue.js?ver=2" defer></script>
</head>
<body class="archive-page">
  <header class="archive-header">
    <a class="back-home" href="index.html" aria-label="Torna alla home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
    </a>
  </header>
  <main class="archive-main">
    <h1 class="archive-title" aria-hidden="true">Discography</h1>
    <p id="archive-status" role="status">Caricamento della discografia…</p>
    <ol id="release-index" class="release-index" aria-label="Pubblicazioni dalla più recente alla più vecchia"></ol>
    <noscript>Attiva JavaScript per visualizzare le pubblicazioni.</noscript>
  </main>
  <script>
    (() => {
      const list = document.getElementById('release-index');
      const title = document.querySelector('.archive-title');
      let frame = 0;
      function schedule() {
        if (frame) return;
        frame = requestAnimationFrame(() => {
          frame = 0;
          const first = list.firstElementChild;
          if (!first) return;
          const top = first.getBoundingClientRect().top + window.scrollY;
          title.style.setProperty('--archive-title-top', `${top}px`);
          // shown once the fonts have settled, so it does not move after appearing
          if (document.fonts.status === 'loaded') title.classList.add('is-placed');
        });
      }
      new MutationObserver(schedule).observe(list, { childList: true });
      const sizes = new ResizeObserver(schedule);
      sizes.observe(document.querySelector('.archive-header'));
      sizes.observe(document.querySelector('.archive-main'));
      window.addEventListener('resize', schedule);
      window.addEventListener('pageshow', schedule);
      document.fonts.ready.then(schedule);
      schedule();
    })();
  </script>
</body>
</html>
