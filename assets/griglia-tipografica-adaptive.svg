<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" aria-hidden="true" focusable="false">
  <title>Griglia tipografica di puntini e croci alternate</title>
  <desc>Pattern trasparente con puntini e croci sottili, con colori adattati alle versioni chiara e scura.</desc>
  <defs>
    <pattern id="typographic-grid" x="0" y="0" width="96" height="96" patternUnits="userSpaceOnUse">
      <g fill="currentColor" fill-opacity="0.16">
        <circle cx="24" cy="24" r="0.85"/>
        <circle cx="72" cy="72" r="0.85"/>
      </g>
      <g fill="none" stroke="currentColor" stroke-opacity="0.12" stroke-width="0.65" stroke-linecap="butt">
        <path d="M68.5 24h7 M72 20.5v7 M20.5 72h7 M24 68.5v7"/>
      </g>
    </pattern>
  </defs>
  <rect width="192" height="192" fill="url(#typographic-grid)"/>
</svg>
